# Yarn itself is committed under .yarn/releases and named here, so whichever yarn
# is on the PATH (the 1.22 that the Node images, the GitHub runners and Vercel
# ship) hands over to this exact release. No Corepack step anywhere, and one
# command to bump it: `yarn set version <version> --yarn-path` rewrites this
# line, the release and packageManager in package.json together.
yarnPath: .yarn/releases/yarn-4.18.1.cjs

# A plain node_modules rather than Plug'n'Play: Vite, Storybook and Nitro all
# resolve from disk.
nodeLinker: node-modules

# This Yarn release ships with install scripts off. On is what installs the git
# hooks: `yarn install` runs the project's postinstall, and that runs husky.
enableScripts: true

# Yarn holds a release back until it is a day old. zimme-zoom is published from
# this author's own repository, so a fix can be picked up the day it ships.
npmPreapprovedPackages:
  - zimme-zoom
