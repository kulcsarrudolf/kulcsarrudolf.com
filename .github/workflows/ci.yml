name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pre-commit hook is for local commits; the runner never commits.
  HUSKY: 0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The version comes from packageManager in package.json, the one place
      # it is pinned. There is no cache step: a cold install takes less time
      # than restoring a cache would.
      - name: Install upm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: upm install --frozen-lockfile
      # Squash-merge uses the pull request title as the commit subject, so it
      # has to pass the same check as a local commit message.
      - name: Check pull request title and branch name
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          printf '%s\n' "$PR_TITLE" | upm exec commitlint
          node scripts/check-branch-name.ts "$HEAD_REF"

      - run: upm run typecheck
      - run: upm run lint
      - run: upm run format:check
      - run: upm run test
      - run: upm run build
      - run: upm run build-storybook
